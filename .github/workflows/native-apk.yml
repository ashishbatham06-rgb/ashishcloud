name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'native-app/**'
      - '.github/workflows/native-apk.yml'
    tags: ['native-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ashish-cloud-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ashish-cloud-native-apk
          path: native-app/ashish-cloud-native.apk

      - name: Publish to "native-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: Ashish Cloud Native (latest build)
          prerelease: false
          files: native-app/ashish-cloud-native.apk
